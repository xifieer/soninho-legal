<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://apps.apple.com/br/app/id6835849190">
<title>Baixar — Soninho do Bebê</title>
<style>
  :root {
    --bg: #150E1A;
    --text: #FFF6FA;
    --muted: rgba(255, 246, 250, .72);
    --pink: #FF8FB1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 24px; text-align: center;
    background: radial-gradient(120% 90% at 50% 0%, #2C1E38 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 10px; }
  p { color: var(--muted); font-size: 16px; margin: 0 0 26px; }
  a.btn {
    display: inline-block; padding: 16px 30px; border-radius: 999px;
    background: var(--pink); color: #2A0E1A;
    font-weight: 600; font-size: 17px; text-decoration: none;
  }
  .hint { margin-top: 22px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Soninho do Bebê</h1>
  <p>Abrindo a App Store…</p>
  <a class="btn" href="https://apps.apple.com/br/app/id6835849190">Abrir na App Store</a>
  <p class="hint">Se a App Store não abrir, toque no botão acima.</p>
</div>
<script>
  setTimeout(function () { location.replace("https://apps.apple.com/br/app/id6835849190"); }, 300);
</script>
</body>
</html>
